<!-- Nút bong bóng -->
<button class="chat-toggle-btn" (click)="toggleChat()">💬</button>

<!-- Cửa sổ chat -->
<div class="chat-widget" *ngIf="showChat">
  <!-- Header -->
  <div class="chat-header">
    <span>Chat với Bot</span>
    <button class="close-btn" (click)="toggleChat()">✕</button>
  </div>

  <!-- Messages -->
  <div class="chat-window">
    <div
      *ngFor="let m of messages"
      class="message-wrapper"
      [ngClass]="{ 'user': m.fromUser, 'bot': !m.fromUser }"
    >
      <div class="avatar">
        <img
          [src]="
            m.fromUser
              ? 'assets/user-avatar.png'
              : 'assets/bot-avatar.png'
          "
          alt="avatar"
        />
      </div>
      <div class="bubble">{{ m.text }}</div>
    </div>
  </div>

  <!-- Input + Buttons -->
  <div class="input-area">
    <input
      type="text"
      placeholder="Type a message..."
      [(ngModel)]="newMsg"
      (keydown.enter)="sendMessage()"
      [disabled]="loading"
    />
    <button (click)="sendMessage()" [disabled]="loading">➤</button>
    <button class="mic-button">🎤</button>
  </div>
</div>
